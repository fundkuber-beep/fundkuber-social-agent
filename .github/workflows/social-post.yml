name: Fund Kuber Social Agent

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Post slot"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - afternoon
          - night
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 9 * * *"
    - cron: "30 16 * * *"

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install Pillow requests
      - name: Determine slot
        id: slot
        shell: bash
        run: |
          if [ -n "${{ inputs.slot }}" ]; then
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            hour=$(TZ=Asia/Kolkata date +%H)
            case "$hour" in
              09) echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
              15) echo "slot=afternoon" >> "$GITHUB_OUTPUT" ;;
              22) echo "slot=night" >> "$GITHUB_OUTPUT" ;;
              *) echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Generate post and image
        env:
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/agent.py

      - name: Publish image to public GitHub URL
        id: image
        shell: bash
        run: |
          mkdir -p generated/posts
          filename="${{ steps.slot.outputs.slot }}-${{ github.run_id }}.jpg"
          cp post.jpg "generated/posts/$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          git config user.name "Fund Kuber Social Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "generated/posts/$filename"
          git add post.json
          git commit -m "Generate social post $filename" || echo "Nothing to commit"
          git push

      - name: Wait for raw image to become available
        run: sleep 10

      - name: Publish to Facebook and Instagram
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          PUBLIC_IMAGE_URL: https://raw.githubusercontent.com/fundkuber-beep/fundkuber-social-agent/main/generated/posts/${{ steps.image.outputs.filename }}
        run: python src/publish.py

name: Fund Kuber Social Agent

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Post slot"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - afternoon
          - night
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 16 * * *"

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install Pillow requests
      - name: Determine slot
        id: slot
        shell: bash
        run: |
          if [ -n "${{ inputs.slot }}" ]; then
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            hour=$(TZ=Asia/Kolkata date +%H)
            case "$hour" in
              09) echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
              15) echo "slot=afternoon" >> "$GITHUB_OUTPUT" ;;
              22) echo "slot=night" >> "$GITHUB_OUTPUT" ;;
              *) echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Run agent
        env:
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          PUBLIC_IMAGE_URL: ${{ secrets.PUBLIC_IMAGE_URL }}
        run: python src/agent.py
